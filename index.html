<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXAM JUNCTION</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
padding-bottom:80px;
}

/* HERO */

.hero{
background:linear-gradient(135deg,#0d6efd,#003b99);
color:white;
padding:30px 20px;
text-align:center;
}

.hero h1{
font-size:32px;
margin-bottom:8px;
}

.hero p{
opacity:.9;
}

.stats{
display:flex;
justify-content:space-around;
margin-top:20px;
}

.stats h2{
font-size:22px;
}

.stats span{
font-size:13px;
}

/* SEARCH */

.search-box{
padding:15px;
}

.search-box input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

/* QUICK MENU */

.quick-menu{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
padding:0 15px 15px;
}

.quick-menu a{
background:white;
padding:18px;
text-decoration:none;
color:black;
text-align:center;
font-weight:bold;
border-radius:14px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

/* SECTION */

.section-title{
padding:0 15px;
font-size:22px;
font-weight:bold;
margin-bottom:10px;
}

/* BATCH */

.batch-card{
background:white;
margin:15px;
padding:18px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.batch-card h3{
margin-bottom:8px;
}

.batch-card p{
color:#666;
margin-bottom:12px;
}

.batch-card a{
display:inline-block;
padding:10px 16px;
background:#0d6efd;
color:white;
text-decoration:none;
border-radius:10px;
}

.lock-badge{
float:right;
background:red;
color:white;
padding:4px 10px;
border-radius:20px;
font-size:12px;
margin-bottom:10px;
}

/* BOTTOM NAV */

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:12px 0;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

.bottom-nav a{
text-decoration:none;
color:#333;
font-size:13px;
text-align:center;
}
</style>
</head>

<body>

<header class="hero">
<h1>EXAM JUNCTION</h1>
<p>SSC • Railway • Banking • Defence</p>

<div class="stats">
<div>
<h2>500+</h2>
<span>Batches</span>
</div>

<div>
<h2>10K+</h2>
<span>Students</span>
</div>

<div>
<h2>24×7</h2>
<span>Support</span>
</div>
</div>
</header>

<div class="search-box">
<input type="text" id="searchInput" placeholder="🔍 Search Batch">
</div>

<div class="quick-menu">
<a href="books.html">📚 Books</a>
<a href="notifications.html">🔔 Notifications</a>
<a href="leaderboard.html">🏆 Leaderboard</a>
<a href="profile.html">👤 Profile</a>
</div>

<div class="section-title">
🔥 Premium Batches
</div>

<div id="batchContainer"></div>

<div class="bottom-nav">
<a href="index.html">🏠<br>Home</a>
<a href="books.html">📚<br>Books</a>
<a href="notifications.html">🔔<br>Notifications</a>
<a href="leaderboard.html">🏆<br>Leaderboard</a>
<a href="profile.html">👤<br>Profile</a>
</div>

<script>

fetch("data/batches.json")
.then(response => response.json())
.then(data => {

const container =
document.getElementById("batchContainer");

function render(items){

container.innerHTML="";

items.forEach(batch=>{

container.innerHTML += `

<div class="batch-card">

${batch.locked ?
'<span class="lock-badge">🔒 Paid</span>' : ''}

<h3>${batch.title}</h3>

<p>${batch.teacher}</p>

<a href="${batch.link}">
${batch.locked ? 'Unlock Batch' : 'Open Batch'}
</a>

</div>

`;

});

}

render(data);

document
.getElementById("searchInput")
.addEventListener("keyup",function(){

let keyword =
this.value.toLowerCase();

let filtered =
data.filter(item =>
item.title.toLowerCase()
.includes(keyword)
);

render(filtered);

});

});

</script>

</body>
</html>
