<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Junction</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f5f5f5;
}

.header{
background:#0d47a1;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.search{
padding:15px;
}

.search input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
}

.container{
padding:15px;
padding-bottom:90px;
}

.batch{
background:white;
padding:15px;
margin-bottom:10px;
border-radius:12px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.batch a{
text-decoration:none;
color:#0d47a1;
font-weight:bold;
}

.lock{
color:red;
font-weight:bold;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
display:flex;
justify-content:space-around;
padding:10px;
box-shadow:0 -2px 5px rgba(0,0,0,0.1);
}

.bottom a{
text-decoration:none;
color:black;
font-size:14px;
text-align:center;
}
</style>
</head>

<body>

<div class="header">
Exam Junction
</div>

<div class="search">
<input type="text" id="search" placeholder="Search Batch...">
</div>

<div class="container" id="batches">
Loading...
</div>

<div class="bottom">
<a href="books.html">📚<br>Books</a>
<a href="notifications.html">🔔<br>Notifications</a>
<a href="leaderboard.html">🏆<br>Leaderboard</a>
<a href="profile.html">👤<br>Profile</a>
</div>

<script>

let allBatches=[];

fetch("data/batches.json")
.then(r=>r.json())
.then(data=>{

allBatches=data;
showData(data);

});

function showData(data){

let html="";

data.forEach(batch=>{

if(batch.type==="paid"){

html+=`
<div class="batch">
<div class="lock">🔒 Paid Batch</div>
<h3>${batch.title}</h3>
</div>
`;

}else{

html+=`
<div class="batch">
<h3>${batch.title}</h3>
<a href="${batch.link}" target="_blank">
Open Batch
</a>
</div>
`;

}

});

document.getElementById("batches").innerHTML=html;

}

document.getElementById("search")
.addEventListener("input",function(){

let q=this.value.toLowerCase();

let filtered=allBatches.filter(x=>
x.title.toLowerCase().includes(q)
);

showData(filtered);

});

</script>

</body>
</html>
